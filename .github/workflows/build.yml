name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  # Each push to `main` gets its own group, so every commit there is built.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck kernel
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Native Bun kernel smoke
        run: bun run test:bun

  bun-runtime:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Bun-only source install and runtime
        run: >-
          docker run --rm
          --mount type=bind,src="${{ github.workspace }}",dst=/source,readonly
          --env CORDIS_BUN_ONLY_IMAGE=1
          --entrypoint /usr/local/bin/bun
          oven/bun:1.4.4
          /source/packages/host-bun/tests/bun-only.ts

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [24, 26]

    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install
        run: bun install --frozen-lockfile
      - name: Install fixture package managers
        run: npm install -g --force corepack@latest
      - name: Enable fixture package managers
        run: corepack enable
      - name: Unit Test
        run: bun run test:json
